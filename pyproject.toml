[project]
name = "rr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ky Anh Vo", email = "tommyvo0406@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "scipy>=1.18.1",
]

[project.scripts]
rr = "rr:main"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]

# Virtual environment setup (helps LSPs find installed packages)
venvPath = "."
venv = ".venv"

# Type checking rules
pythonVersion = "3.12"
typeCheckingMode = "standard" # Options: "off", "basic", "standard", "strict"
reportMissingImports = "error"
reportUnusedVariable = "warning"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
# Stages 2-3. Needs CUDA 12; torch pins CUDA 13, so the two cannot share an environment.
colmap = ["pycolmap-cuda12>=4.2.1; python_version < '3.15' and sys_platform == 'linux'"]
# Stage 4.
segmentation = [
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchcodec>=0.0.0.dev0",
    "torchvision>=0.29.2",
]

[tool.uv]
default-groups = ["dev", "colmap"]
conflicts = [[{ group = "colmap" }, { group = "segmentation" }]]
